<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Idle Kingdom</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="game">

    <header>
        <h1>Idle Kingdom</h1>
    </header>

    <div class="layout">

        <div class="card">

            <h2>Character</h2>

            <div class="stat">
                <span>Gold</span>
                <span id="gold">0</span>
            </div>

            <div class="stat">
                <span>Age</span>
                <span>14</span>
            </div>

            <div class="stat">
                <span>Job</span>
                <span>Beggar</span>
            </div>

            <button id="workBtn">
                Work
            </button>

        </div>

        <div class="card">

            <h2>Skills</h2>

            <p class="coming-soon">
                Coming Soon...
            </p>

        </div>

        <div class="card">

            <h2>Jobs</h2>

            <p class="coming-soon">
                Coming Soon...
            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
