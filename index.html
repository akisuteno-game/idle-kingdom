<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Idle Kingdom</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="game">

<header>
<h1>Idle Kingdom</h1>
</header>

<div class="layout">

<div class="card">

<h2>ステータス</h2>

<div class="stat">
<span>所持金</span>
<span id="gold">0</span>
</div>

<div class="stat">
<span>年齢</span>
<span id="age">14</span>
</div>

<div class="stat">
<span>現在の職業</span>
<span id="currentJob">なし</span>
</div>

</div>

<div class="card">

<h2>作業進捗</h2>

<div class="progress-bar">
<div id="progressFill"></div>
</div>

<p id="progressText">
職業を選択してください
</p>

</div>

<div class="card">

<h2>職業一覧</h2>

<button id="beggarBtn">
物乞い
</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
